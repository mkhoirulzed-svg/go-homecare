<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Go-Homecare</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f1f5f9;color:#0f172a;margin:0;padding:18px}main{max-width:800px;margin:auto}.card{background:white;border-radius:14px;padding:20px;margin:12px 0}button{padding:11px 14px;border:0;border-radius:8px;background:#0d9488;color:white;margin:5px;cursor:pointer}.item{padding:14px;border:1px solid #ddd;border-radius:10px;margin:12px 0}.muted{color:#64748b;font-size:13px}.hidden{display:none}#status{padding:12px;background:#f8fafc;white-space:pre-wrap}</style></head><body><main><section class="card"><h1>Admin Go-Homecare</h1><p>Panel peninjauan permohonan praktisi.</p><div id="status">Memeriksa sesi…</div><button id="login" class="hidden">Login Google</button><button id="reload" class="hidden">Muat ulang</button><button id="logout" class="hidden">Keluar</button></section><section id="panel" class="card hidden"><h2>Permohonan menunggu verifikasi</h2><div id="apps">Memuat…</div></section><p><a href="index.html">Kembali ke halaman utama</a></p></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import{getFirestore,collection,query,where,getDocs,doc,getDoc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
const ADMIN_UID="Vsl0uEluR5TCOdqVY7UPX2wfw6y1";
const app=initializeApp({apiKey:"AIzaSyCTBaq4nzvolat37ivwPluP_fOmgoAvm_E",authDomain:"gocare-c94bc.firebaseapp.com",projectId:"gocare-c94bc",storageBucket:"gocare-c94bc.firebasestorage.app",messagingSenderId:"123940961680",appId:"1:123940961680:web:bb842fd8925e2432230715"}),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);function msg(t){$("status").textContent=t}function esc(v){return String(v??"-").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("login").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){msg("Login gagal: "+e.message)}};$("logout").onclick=()=>signOut(auth);$("reload").onclick=load;
onAuthStateChanged(auth,async u=>{if(!u){$("login").classList.remove("hidden");$("reload").classList.add("hidden");$("logout").classList.add("hidden");$("panel").classList.add("hidden");msg("Silakan login dengan akun admin.");return}if(u.uid!==ADMIN_UID){msg("Akses ditolak: akun ini bukan admin.");await signOut(auth);return}$("login").classList.add("hidden");$("reload").classList.remove("hidden");$("logout").classList.remove("hidden");msg("Login admin berhasil.");await load()});
async function load(){$("panel").classList.remove("hidden");$("apps").textContent="Memuat…";try{const s=await getDocs(query(collection(db,"practitionerApplications"),where("status","==","pending")));$("apps").replaceChildren();if(s.empty){$("apps").textContent="Belum ada permohonan pending.";return}s.forEach(d=>{const x=d.data(),el=document.createElement("article");el.className="item";el.innerHTML="<h3>"+esc(x.nama)+"</h3><p>Email: "+esc(x.email)+"<br>WhatsApp: "+esc(x.phone)+"<br>STR: "+esc(x.strNumber)+"<br>Pengalaman: "+esc(x.experience)+" tahun<br>Keahlian: "+esc(x.specialization)+"<br>Tarif: Rp "+esc(x.tarif)+"<br>Deskripsi: "+esc(x.bio)+"</p><p class='muted'>UID: "+esc(x.uid)+"</p><button class='yes'>Setujui</button><button class='no' style='background:#b91c1c'>Tolak</button>";el.querySelector(".yes").onclick=()=>review(d.id,x,true,el);el.querySelector(".no").onclick=()=>review(d.id,x,false,el);$("apps").appendChild(el)})}catch(e){$("apps").textContent="Gagal memuat. Pastikan Firestore Rules sudah diterapkan dan koleksi practitionerApplications tersedia. "+e.message}}
async function review(id,x,approve,el){if(!confirm((approve?"Setujui":"Tolak")+" permohonan "+(x.nama||"praktisi")+"?"))return;el.querySelectorAll("button").forEach(b=>b.disabled=true);try{const appRef=doc(db,"practitionerApplications",id);if(approve){const userRef=doc(db,"users",x.uid),userSnap=await getDoc(userRef);if(!userSnap.exists())throw new Error("Dokumen profil pemohon tidak ditemukan.");await updateDoc(userRef,{role:"praktisi",isVerified:true,profileComplete:true,strNumber:x.strNumber||"",experience:x.experience||"",specialization:x.specialization||"",bio:x.bio||"",tarif:x.tarif||"",updatedAt:serverTimestamp()})}await updateDoc(appRef,{status:approve?"approved":"rejected",reviewedBy:auth.currentUser.uid,reviewedAt:serverTimestamp(),updatedAt:serverTimestamp()});alert(approve?"Praktisi berhasil disetujui.":"Permohonan ditolak.");await load()}catch(e){alert("Belum berhasil. Pastikan Firestore Rules sudah dikonfigurasi. Detail: "+e.message);el.querySelectorAll("button").forEach(b=>b.disabled=false)}}
</script></body></html>
