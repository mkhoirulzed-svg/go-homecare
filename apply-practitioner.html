<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengajuan Praktisi - Go-Homecare</title>
<style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f1f5f9;color:#0f172a;font:16px system-ui,sans-serif}main{max-width:620px;margin:auto}.card{background:white;border-radius:16px;padding:22px;margin:12px 0}h1{font-size:24px;margin:0 0 8px}p{color:#475569;line-height:1.5}.field{margin:14px 0}label{display:block;font-weight:650;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}textarea{min-height:90px}button{padding:12px 16px;border:0;border-radius:9px;background:#0d9488;color:white;font-weight:700;cursor:pointer;width:100%;margin-top:10px}button:disabled{opacity:.5}#status{padding:12px;background:#f8fafc;border-radius:8px;white-space:pre-wrap}.hidden{display:none}</style></head><body><main>
<section class="card"><h1>Pengajuan Praktisi</h1><p>Isi data profesional untuk diajukan kepada admin. Role akun Anda tetap pasien sampai permohonan disetujui.</p><div id="status">Memeriksa login…</div><button id="login" class="hidden">Login dengan Google</button></section>
<form id="form" class="card hidden">
<div class="field"><label for="nama">Nama lengkap</label><input id="nama" required maxlength="120"></div>
<div class="field"><label for="phone">Nomor WhatsApp</label><input id="phone" required type="tel" maxlength="30"></div>
<div class="field"><label for="str">Nomor STR</label><input id="str" required maxlength="100"></div>
<div class="field"><label for="experience">Pengalaman kerja (tahun)</label><input id="experience" required type="number" min="0" max="80"></div>
<div class="field"><label for="specialization">Keahlian / spesialisasi</label><input id="specialization" required maxlength="160" placeholder="Contoh: perawatan luka"></div>
<div class="field"><label for="tarif">Tarif dasar per kunjungan (Rp)</label><input id="tarif" required type="number" min="0"></div>
<div class="field"><label for="bio">Deskripsi pengalaman</label><textarea id="bio" required maxlength="1000"></textarea></div>
<button id="submit" type="submit">Kirim permohonan</button>
</form><p><a href="index.html" id="homeLink">Kembali ke halaman utama</a></p>
</main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCTBaq4nzvolat37ivwPluP_fOmgoAvm_E",authDomain:"gocare-c94bc.firebaseapp.com",projectId:"gocare-c94bc",storageBucket:"gocare-c94bc.firebasestorage.app",messagingSenderId:"123940961680",appId:"1:123940961680:web:bb842fd8925e2432230715"}),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);let currentUser=null;
function status(s){$("status").textContent=s}
$("login").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){status("Login gagal: "+e.message)}};
onAuthStateChanged(auth,async user=>{currentUser=user;if(!user){$("login").classList.remove("hidden");$("form").classList.add("hidden");status("Login dengan akun Google pasien untuk mengajukan permohonan.");return}try{const p=await getDoc(doc(db,"users",user.uid));if(!p.exists()){status("Profil pengguna belum ditemukan. Silakan daftar sebagai pasien terlebih dahulu.");$("form").classList.add("hidden");return}if(p.data().role!=="pasien"){status("Akun ini bukan akun pasien. Jika praktisi sudah disetujui, masuk melalui halaman utama.");$("form").classList.add("hidden");return}const existing=await getDoc(doc(db,"practitionerApplications",user.uid));if(existing.exists()){status("Permohonan sebelumnya ditemukan. Status: "+existing.data().status+". Hubungi admin jika perlu pengajuan ulang.");$("form").classList.add("hidden");return}status("Login sebagai "+(user.email||"pasien")+". Silakan lengkapi data permohonan.");$("form").classList.remove("hidden");$("nama").value=p.data().nama||user.displayName||"";$("phone").value=p.data().phone||""}catch(e){status("Gagal memeriksa profil: "+e.message)}});
$("homeLink").addEventListener("click",async e=>{e.preventDefault();try{await signOut(auth)}catch(err){console.error("Gagal mengakhiri sesi:",err)}window.location.replace("index.html")});
$("form").addEventListener("submit",async e=>{e.preventDefault();if(!currentUser){status("Silakan login kembali.");return}const b=$("submit");b.disabled=true;try{const p=await getDoc(doc(db,"users",currentUser.uid));if(!p.exists()||p.data().role!=="pasien")throw new Error("Hanya akun pasien yang dapat mengajukan permohonan.");const applicationRef=doc(db,"practitionerApplications",currentUser.uid);const existing=await getDoc(applicationRef);if(existing.exists())throw new Error("Permohonan sudah ada dengan status: "+existing.data().status);await setDoc(applicationRef,{uid:currentUser.uid,nama:$("nama").value.trim(),email:currentUser.email||"",phone:$("phone").value.trim(),strNumber:$("str").value.trim(),experience:$("experience").value,specialization:$("specialization").value.trim(),bio:$("bio").value.trim(),tarif:$("tarif").value,status:"pending",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});status("Permohonan berhasil dikirim. Role akun Anda tetap pasien sampai admin menyetujui permohonan.");$("form").classList.add("hidden");await signOut(auth)}catch(err){status("Permohonan gagal dikirim: "+err.message);b.disabled=false}});
</script></body></html>
