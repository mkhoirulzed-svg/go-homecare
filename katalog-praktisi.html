<body>
<div class="app">
  <header><a class="back" href="patient.html"><span aria-hidden="true">←</span> Kembali ke dashboard</a><p class="eyebrow">Go-Homecare · Layanan kesehatan</p><h1>Praktisi & Layanan</h1></header>
  <main>
    <div class="tools"><input id="search" type="search" placeholder="⌕  Cari layanan, praktisi, atau lokasi…" aria-label="Cari katalog"><select id="typeFilter" aria-label="Jenis lokasi"><option value="">Semua jenis lokasi</option><option value="practice">Klinik / tempat praktik</option><option value="home_visit">Kunjungan ke rumah</option></select></div>
    <div id="status" class="status" role="status">Memeriksa sesi dan memuat katalog…</div>
    <div id="catalog"></div>
    <section aria-label="Bantuan pemesanan" style="margin-top:18px;padding:16px;border:1px solid #e2e8f0;border-radius:15px;background:#f8fafc">
      <strong style="display:block;font-size:14px;margin-bottom:6px">Tidak menemukan layanan yang dibutuhkan?</strong>
      
      <a href="booking.html" style="display:block;text-align:center;text-decoration:none;background:#fff;border:1px solid #0f766e;color:#0f766e;padding:11px;border-radius:10px;font-size:13px;font-weight:800">Ajukan permintaan umum</a>
    </section>
  </main>
</div>
<script type="module">
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCTBaq4nzvolat37ivwPluP_fOmgoAvm_E",authDomain:"gocare-c94bc.firebaseapp.com",projectId:"gocare-c94bc",storageBucket:"gocare-c94bc.firebasestorage.app",messagingSenderId:"123940961680",appId:"1:123940961680:web:bb842fd8925e2432230715"};
const app=getApps().length?getApps()[0]:initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);let rows=[];
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function rupiah(v){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(v)||0);}
function render(){
 const term=$("search").value.trim().toLocaleLowerCase("id-ID"),type=$("typeFilter").value;
 const filtered=rows.filter(r=>(!type||r.location.locationType===type)&&(!term||[
  r.location.name,r.location.area,r.location.city,r.location.province,r.location.address,
  r.profile?.name,r.profile?.nama,r.profile?.specialization,r.profile?.bio,r.profile?.serviceArea,
  ...r.services.map(s=>(s.name||"")+" "+(s.description||""))
 ].filter(Boolean).join(" ").toLocaleLowerCase("id-ID").includes(term)));
 $("catalog").replaceChildren();
 if(!filtered.length){$("catalog").innerHTML='<div class="empty">Belum ada praktisi atau layanan yang cocok. Coba kata kunci lain atau periksa kembali nanti.</div>';return;}
 const groups=new Map();
 for(const row of filtered){
  const p=row.profile||{}, key=row.location.ownerUid||p.uid||p.name||p.nama||row.location.id;
  if(!groups.has(key))groups.set(key,{profile:p,rows:[]});
  const group=groups.get(key);
  group.rows.push(row);
  if(!group.profile||(!group.profile.name&&!group.profile.nama))group.profile=p;
 }
 for(const [key,group] of groups){
  const p=group.profile||{}, entries=group.rows;
  const services=entries.flatMap(row=>row.services.map(item=>({service:item,location:row.location})));
  const prices=services.map(item=>Number(item.service.price)).filter(price=>Number.isFinite(price)&&price>=0);
  const minPrice=prices.length?Math.min(...prices):null;
  const name=p.name||p.nama||"Praktisi kesehatan";
  const specialty=p.specialization||p.jenisPraktisi||p.jenisPraktisiLayanan||"Praktisi kesehatan";
  const experience=p.experienceYears??p.experience;
  const expText=experience!==undefined&&experience!==null&&String(experience).trim()!==""?String(experience)+" tahun pengalaman":"";
  const photo=p.photoURL||p.photoUrl||p.photo||p.foto||p.avatarUrl||"";
  const locations=[...new Map(entries.map(row=>[row.location.id,row.location])).values()];
  const badgeHtml=locations.map(x=>{
   const isHome=x.locationType==="home_visit";
   const label=isHome?"Kunjungan rumah":("Klinik · "+(x.name||"Tempat praktik"));
   return '<span class="location-badge '+(isHome?"home":"practice")+'"><span class="dot" aria-hidden="true"></span>'+escapeHtml(label)+'</span>';
  }).join("");
  const serviceNames=[...new Set(services.map(item=>item.service.name||item.service.title||item.service.serviceName).filter(Boolean))];
  const servicePreview=serviceNames.slice(0,3).join(", ");
  const serviceSummary=servicePreview?'<div class="service-summary">'+escapeHtml(servicePreview)+(serviceNames.length>3?' <span class="service-more">…lihat lainnya</span>':'')+'</div>':(p.bio?'<p class="profile-bio">'+escapeHtml(p.bio)+'</p>':'');
  const firstLocation=locations[0];
  const ownerUid=firstLocation?.ownerUid||p.uid||"";
  const detailUrl="detail-praktisi.html?"+(ownerUid?"ownerUid="+encodeURIComponent(ownerUid):"locationId="+encodeURIComponent(firstLocation?.id||""));
  const card=document.createElement("article");card.className="card profile-card";
  const avatar=photo?'<img class="profile-photo" src="'+escapeHtml(photo)+'" alt="Foto '+escapeHtml(name)+'" loading="lazy" referrerpolicy="no-referrer">':'<div class="profile-avatar" aria-hidden="true">'+escapeHtml((name.trim().charAt(0)||"P").toUpperCase())+'</div>';
  card.setAttribute("role","link");card.setAttribute("tabindex","0");card.setAttribute("aria-label","Lihat profil dan layanan "+name);
  card.innerHTML='<div class="profile-main">'+avatar+'<div class="profile-head"><div><h2 class="profile-name">'+escapeHtml(name)+'</h2><p class="profile-specialty">'+escapeHtml(specialty)+(expText?' · '+escapeHtml(expText):'')+'</p></div></div>'+serviceSummary+'<div class="location-badges">'+badgeHtml+'</div><div class="starting-price"><span class="starting-value">'+(minPrice===null?"Konfirmasi tarif":'Mulai dari '+rupiah(minPrice))+'</span></div></div>';
  card.addEventListener("click",()=>{window.location.href=detailUrl;});
  card.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();window.location.href=detailUrl;}});
  const photoEl=card.querySelector(".profile-photo");
  if(photoEl)photoEl.addEventListener("error",()=>{const fallback=document.createElement("div");fallback.className="profile-avatar";fallback.setAttribute("aria-hidden","true");fallback.textContent=(name.trim().charAt(0)||"P").toUpperCase();photoEl.replaceWith(fallback);},{once:true});
  $("catalog").append(card);
 }
}
async function loadCatalog(){
 $("status").textContent="Memuat lokasi dan layanan yang dipublikasikan…";
 try{
  const locSnap=await getDocs(query(collection(db,"practitionerLocations"),where("status","==","published")));
  const locations=locSnap.docs.map(d=>({id:d.id,...d.data()}));
  const loaded=await Promise.all(locations.map(async location=>{
   const [ss,profileSnap]=await Promise.all([
    getDocs(query(collection(db,"practitionerLocations",location.id,"services"),where("status","==","published"))),
    location.ownerUid ? getDoc(doc(db,"practitionerPublicProfiles",location.ownerUid)) : Promise.resolve(null)
   ]);
   return {
    location,
    profile:profileSnap&&profileSnap.exists()?profileSnap.data():null,
    services:ss.docs.map(d=>({id:d.id,...d.data()}))
   };
  }));
  rows=loaded.filter(r=>r.services.length>0);
  $("status").textContent=rows.length?"":"Belum ada lokasi atau layanan yang tersedia saat ini.";
  render();
 }catch(error){console.error("Gagal memuat katalog:",error);$("status").textContent="Katalog belum dapat dimuat. Pastikan sesi pasien aktif dan Firestore Rules yang sesuai sudah tersedia. ("+(error.code||"kesalahan")+")";}
}
const initialSearch = new URLSearchParams(window.location.search).get("search");
if (initialSearch) $("search").value = initialSearch;
$("search").addEventListener("input",render);$("typeFilter").addEventListener("change",render);
onAuthStateChanged(auth,async user=>{
 if(!user){$("status").textContent="Silakan masuk ke akun pasien untuk melihat katalog.";return;}
 try{const snap=await getDoc(doc(db,"users",user.uid));if(!snap.exists()||snap.data().role!=="pasien"||snap.data().profileComplete!==true){$("status").textContent="Katalog ini tersedia untuk akun pasien dengan profil lengkap.";return;}await loadCatalog();}
 catch(error){console.error(error);$("status").textContent="Tidak dapat memverifikasi akun pasien.";}
});
</script>
