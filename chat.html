<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e">
<title>Chat Layanan - Go Homecare</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#0f172a;background:#f1f5f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:620px;min-height:100vh;background:#fff;display:flex;flex-direction:column;box-shadow:0 8px 32px #0f172a12}
header{padding:18px;background:#0f766e;color:#fff}.back{border:0;background:#ffffff20;color:#fff;border-radius:10px;padding:9px 12px;font:inherit}h1{font-size:20px;margin:16px 0 5px}#bookingInfo{font-size:13px;line-height:1.5}
#notice{padding:10px 16px;background:#f0fdfa;color:#115e59;font-size:13px;border-bottom:1px solid #ccfbf1}.followup-actions{padding:12px 16px;background:#fff;border-bottom:1px solid #e2e8f0}.followup-actions button{width:100%;border:0;border-radius:12px;padding:12px 14px;background:#0d9488;color:#fff;font:inherit;font-size:14px;font-weight:700}.followup-help{font-size:12px;color:#64748b;line-height:1.5;margin-top:7px}.error{color:#b91c1c!important}
#messages{padding:18px 14px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:250px}.empty{margin:auto;text-align:center;color:#64748b;font-size:14px;padding:20px}
.message{max-width:86%;align-self:flex-start;background:#f1f5f9;border-radius:14px 14px 14px 4px;padding:10px 12px;overflow-wrap:anywhere}.message.mine{align-self:flex-end;background:#ccfbf1;border-radius:14px 14px 4px 14px}.sender{font-size:11px;font-weight:700;color:#0f766e;margin-bottom:4px}.body{font-size:14px;line-height:1.45;white-space:pre-wrap}.time{font-size:10px;color:#64748b;text-align:right;margin-top:5px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #e2e8f0;padding-bottom:max(12px,env(safe-area-inset-bottom))}textarea{resize:none;flex:1;min-width:0;max-height:120px;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit;font-size:14px}#send{border:0;border-radius:12px;background:#0d9488;color:#fff;padding:0 16px;font:inherit;font-weight:700}#send:disabled,textarea:disabled{opacity:.55}
</style></head><body><main class="app">
<header><button class="back" id="backBtn" type="button">‹ Kembali</button><h1>Chat Layanan</h1><div id="bookingInfo">Memeriksa pesanan…</div></header>
<div id="notice" role="status">Memuat akses chat…</div><div id="followupActions" class="followup-actions" hidden><button id="newBookingBtn" type="button">Pesan Layanan Baru</button><div class="followup-help">Untuk kunjungan atau tindakan baru, buat pesanan baru agar tercatat di sistem. Chat ini tetap untuk tindak lanjut layanan sebelumnya.</div></div><section id="messages" aria-live="polite"><div class="empty">Memuat pesan…</div></section>
<form id="sendForm"><textarea id="messageInput" rows="1" maxlength="2000" placeholder="Tulis pesan…" aria-label="Tulis pesan" disabled></textarea><button id="send" type="submit" disabled>Kirim</button></form>
</main>
<script type="module">
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,query,orderBy,onSnapshot,addDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
const config={apiKey:"AIzaSyCTBaq4nzvolat37ivwPluP_fOmgoAvm_E",authDomain:"gocare-c94bc.firebaseapp.com",projectId:"gocare-c94bc",storageBucket:"gocare-c94bc.firebasestorage.app",messagingSenderId:"123940961680",appId:"1:123940961680:web:bb842fd8925e2432230715"};
const app=getApps().length?getApps()[0]:initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const bookingId=new URLSearchParams(location.search).get("bookingId"),info=document.getElementById("bookingInfo"),notice=document.getElementById("notice"),messages=document.getElementById("messages"),input=document.getElementById("messageInput"),send=document.getElementById("send");
let currentUser=null,booking=null,sending=false,stopMessages=null,stopBooking=null,isPatientUser=false;
document.getElementById("backBtn").addEventListener("click",()=>history.length>1?history.back():location.assign("index.html"));
document.getElementById("newBookingBtn").addEventListener("click",()=>location.assign("booking.html"));
function composer(open){input.disabled=!open;send.disabled=!open||sending;input.placeholder=open?"Tulis pesan…":"Chat ditutup setelah layanan selesai"}
function updateStatus(){const s=String(booking?.status||"").toLowerCase(),open=["accepted","in_progress","completed"].includes(s);composer(open);document.getElementById("followupActions").hidden=!(isPatientUser&&s==="completed");notice.classList.remove("error");notice.textContent=s==="completed"?"Layanan telah selesai. Chat ini tetap tersedia untuk pertanyaan atau tindak lanjut layanan sebelumnya. Untuk kunjungan atau tindakan baru, silakan buat pesanan baru.":open?"Chat hanya dapat diakses pasien dan praktisi yang ditugaskan.":"Chat tersedia setelah praktisi menerima pesanan."}
function renderMessages(snapshot){messages.replaceChildren();if(snapshot.empty){messages.innerHTML='<div class="empty">Belum ada pesan. Mulai percakapan terkait layanan.</div>';return}
snapshot.forEach(item=>{const d=item.data(),own=d.senderUid===currentUser?.uid,el=document.createElement("article");el.className="message"+(own?" mine":"");
const who=document.createElement("div");who.className="sender";who.textContent=own?"Anda":(booking?.patientUid===d.senderUid?"Pasien":"Praktisi");
const body=document.createElement("div");body.className="body";body.textContent=d.text||"";const time=document.createElement("div");time.className="time";time.textContent=d.createdAt?.toDate?d.createdAt.toDate().toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"}):"Baru saja";el.append(who,body,time);messages.append(el)});messages.scrollTop=messages.scrollHeight}
async function openChat(user){if(!bookingId)throw Error("ID pesanan tidak ditemukan.");const ref=doc(db,"bookingRequests",bookingId),snap=await getDoc(ref);if(!snap.exists())throw Error("Pesanan tidak ditemukan.");
booking=snap.data();const patient=booking.patientUid===user.uid,practitioner=booking.nurseUid===user.uid;if(!patient&&!practitioner)throw Error("Akun ini bukan peserta chat untuk pesanan tersebut.");isPatientUser=patient;
const ps=await getDoc(doc(db,"users",user.uid));if(!ps.exists())throw Error("Profil akun tidak ditemukan.");const profile=ps.data();
if(patient&&profile.role!=="pasien")throw Error("Akun pasien tidak valid.");if(practitioner&&(profile.role!=="praktisi"||profile.isVerified!==true))throw Error("Akun praktisi belum terverifikasi.");
info.textContent=(booking.serviceName||"Layanan homecare")+" · "+(booking.patientName||"Pasien");if(!["accepted","in_progress","completed"].includes(String(booking.status||"")))throw Error("Chat tersedia setelah praktisi menerima pesanan.");updateStatus();
stopBooking?.();stopBooking=onSnapshot(ref,s=>{if(!s.exists())return;booking=s.data();updateStatus()},e=>{console.error(e);notice.textContent="Status pesanan tidak dapat diperbarui.";notice.classList.add("error")});
stopMessages?.();stopMessages=onSnapshot(query(collection(db,"bookingChats",bookingId,"messages"),orderBy("createdAt","asc")),snapshot=>{renderMessages(snapshot);setDoc(doc(db,"bookingChats",bookingId,"reads",user.uid),{lastReadAt:serverTimestamp()},{merge:true}).catch(err=>{console.warn("Status baca chat belum tersimpan:",err.code||err.message);notice.textContent="Chat terbuka, tetapi status baca belum tersimpan. Periksa apakah Firestore Rules terbaru sudah dipublikasikan.";notice.classList.add("error")})},e=>{console.error(e);notice.textContent="Pesan gagal dimuat. Pastikan Firestore Rules chat sudah dipublikasikan.";notice.classList.add("error")})}
document.getElementById("sendForm").addEventListener("submit",async e=>{e.preventDefault();const text=input.value.trim();if(!text||!currentUser||!booking||sending)return;if(!["accepted","in_progress","completed"].includes(String(booking.status||""))){updateStatus();return}
sending=true;composer(true);send.textContent="…";try{await addDoc(collection(db,"bookingChats",bookingId,"messages"),{senderUid:currentUser.uid,text,createdAt:serverTimestamp()});input.value=""}
catch(err){console.error(err);notice.textContent=err.code==="permission-denied"?"Pesan ditolak Firestore Rules. Pastikan aturan chat sudah dipublikasikan.":"Pesan belum terkirim. Periksa koneksi lalu coba lagi.";notice.classList.add("error")}
finally{sending=false;send.textContent="Kirim";updateStatus()}});
onAuthStateChanged(auth,async user=>{if(!user){location.replace("index.html");return}currentUser=user;try{await openChat(user)}catch(err){console.error(err);info.textContent="Pesanan tidak dapat diakses";notice.textContent=err.message||"Akses chat tidak tersedia.";notice.classList.add("error");messages.innerHTML='<div class="empty">Chat tidak dapat dibuka untuk akun atau status pesanan ini.</div>';composer(false)}});
</script></body></html>
